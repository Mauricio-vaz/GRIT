<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prueba.css">
    <title>GRIT</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<body>
    <header>
        <h1>GRIT</h1>
        <p>Control De Actividades Diarias.</p>
    </header>
    <div class="container">
        <label for="inputHabito">Nuevo Habito:</label>
        <input type="text" id="inputHabito" >
        <button class="btnH" onclick="agregarHabito()">Agregar</button>
        <button class="btnH" onclick="desmarcarHabitos()">Desmarcar</button>
        <p id="terminado">HÁBITOS TERMINADOS: </p>
        <div class="habitos"></div>

    </div>

    <script>
        let habitos =JSON.parse(localStorage.getItem("habitos")) || [];

        function guardarHabitos(){
            localStorage.setItem("habitos", JSON.stringify(habitos));
        }
    

        function renderHabitos(){
            const contenedor = document.querySelector(".habitos");
            contenedor.innerHTML = "";

            habitos.forEach((habito, index)=>{
                const p = document.createElement("p");

                p.innerHTML = `
                <input type= "checkbox" id="check${index}" ${habito.completado ? "checked" : "" }
                    onchange="toggleHabito(${index})">

                <spam class="${habito.completado ? "completado" : ""}">
                ${habito.texto}
                </spam>  

                <div class="botones">
                <button class="btnE" onclick="editarHabito(${index})">✏</button>
                <button class="btnE" onclick="eliminarHabito(${index})">🗑</button>
                </div>
                <br>
                `;
                contenedor.appendChild(p);
            });
        }

        function cuentaHabitos(){
            const p = document.getElementById("terminado");
            const terminados = habitos.filter(h => h.completado).length;
            const total = habitos.length;

            p.textContent = `HÁBITOS TERMINADOS: [${terminados} / ${total}]`;
            
            if(terminados === total){
                alert("Terminaste tus hábitos🎉🎈🥳👍");
                confetti({// Lanzar confetti al completar todos los hábitos
                    particleCount: 3000,
                    spread: 110,
                    origin: {y: 1.1, x: 0.5}
                });
            }
        }

        //Agregar un habito
        function agregarHabito(){
            const input = document.querySelector("input[type= 'text']");
            if(!input.value.trim()) return;

            habitos.push({texto: input.value, completado: false});

            input.value = "";
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //marcar o desmarcar un habito

        function toggleHabito(index){
            habitos[index].completado = !habitos[index].completado;
            
            if(habitos[index].completado){
                confetti({
                    particleCount: 500,
                    spread: 80,
                    origin: {y: 1.1}
                });
            }
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //Desmarcar todos los habitos
        function desmarcarHabitos(){
            habitos.forEach(habito =>{
                habito.completado = false;
            });
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //Eliminar Habito
        function eliminarHabito(index){
            habitos.splice(index, 1);
            guardarHabitos();
            renderHabitos();
        }

        //editar habito
        function editarHabito(index){
            const nuevo = prompt("Editar Habito:", habitos[index].texto);
            if(nuevo){
                habitos[index].texto = nuevo;
                guardarHabitos();
                renderHabitos();
            }
        }
        renderHabitos();

    </script>
    
</body>
</html>
