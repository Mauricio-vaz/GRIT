<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prueba.css">
    <title>GRIT</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<body>
    <header>
        <h2>GRIT</h2>
        <p>Control De Actividades Diarias.</p>
    </header>
    <div class="container">
        <label for="inputHabito">Nuevo Habito:</label>
        <input type="text" id="inputHabito" >
        <button class="btnH" onclick="agregarHabito()">Agregar</button>
        <button class="btnH" onclick="desmarcarHabitos()">Desmarcar</button>
        <button class="btnH" onclick="guardarHabitos()">Guardar</button>
        <p id="fecha"></p>
        <p id="terminado">HÁBITOS TERMINADOS: </p>
        <div class="barra-progreso-contenedor">
            <div class="barra-progreso" id="bar"></div>
        </div>
        <div class="habitos"></div>
        <div id="logro" class="logro"></div>
    </div>

    <script>
        let habitos =JSON.parse(localStorage.getItem("habitos")) || [];

        function guardarHabitos(){
            localStorage.setItem("habitos", JSON.stringify(habitos));
        }
        document.addEventListener("DOMContentLoaded", cuentaHabitos);


        //FECHA ACTUAL
        function obtenerFecha(){
            const hoy = new Date();
            const dia = String(hoy.getDate()).padStart(2, 0);
            const mes = String(hoy.getMonth()).padStart(2, 0);
            const año = hoy.getFullYear().toString();
            return `${dia}/${mes}/${año}`;
        }
        const fechaActual = obtenerFecha();
        document.getElementById('fecha').textContent = fechaActual;

        //MOSTRAR LOGRO AL COMPLETAR UN HABITO (toast)
        function mostrarLogro(texto){
            const logro = document.getElementById("logro");

            logro.textContent = texto;
            logro.classList.add("mostrar");
            setTimeout(() => {
                logro.classList.remove("mostrar");
            },2500);
        }

        function renderHabitos(){
            const contenedor = document.querySelector(".habitos");
            contenedor.innerHTML = "";

            habitos.forEach((habito, index)=>{
                const p = document.createElement("p");

                p.innerHTML = `
                <input type= "checkbox" id="check${index}" ${habito.completado ? "checked" : "" }
                    onchange="toggleHabito(${index})">

                <spam class="${habito.completado ? "completado" : ""}">
                ${habito.texto}
                </spam>  

                <div class="botones">
                <button class="btnE" onclick="editarHabito(${index})">✏</button>
                <button class="btnE" onclick="eliminarHabito(${index})">🗑</button>
                </div>
                <br>
                `;
                contenedor.appendChild(p);
            });
        }
        //CUENTA LOS HÁBITOS Y LOS VA ACTUALIZANDO CONFORME VAN TERMINANDO
        function cuentaHabitos(){
            const p = document.getElementById("terminado");
            const terminados = habitos.filter(h => h.completado).length;
            const total = habitos.length;
            
            p.textContent = `HÁBITOS TERMINADOS: [${terminados} / ${total}]`;
            
            let porcentaje = total > 0 ?( terminados / total)* 100 : 0 ;
            document.getElementById("bar").style.width = porcentaje + "%";

            if (terminados === total){
            confetti({// Lanzar confetti al completar todos los hábitos
                particleCount: 3000,
                spread: 110,
                origin: {y: 1.1, x: 0.5}
            });
            mostrarLogro("Terminaste tus hábitos🎉🎈🥳");
        }
    }


        //Agregar un habito
        function agregarHabito(){
            const input = document.querySelector("input[type= 'text']");
            if(!input.value.trim()) return;

            habitos.push({texto: input.value, completado: false});
            
            input.value = "";
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //marcar o desmarcar un habito
        function toggleHabito(index){
            habitos[index].completado = !habitos[index].completado;
            if(habitos[index].completado){
                confetti({
                    particleCount: 800,
                    spread: 80,
                    origin: {y: 1.1},
                    drift: -2,
                    scalar: 0.8,
                    ticks: 300,
                    //colors:['#1a8832', '#d7e613','#2d7ee7'] aun no encuentra una buena convinacion hombre
                    //Poner una variedad surtid a de colores, que se vea mejor
                    shapes: ['circle', 'square']
                });
            }
            if (habitos[index].completado){
                mostrarLogro('Hábito terminado');
            }
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //Desmarcar todos los habitos
        function desmarcarHabitos(){
            //si no hay nada marcado no muestre el mensaje de habitos desmarcados?
                if(!habitos.some(h => h.completado)){
                    return;
                }
                habitos.forEach(habito =>{
                    habito.completado = false;
                });
                mostrarLogro("Hábitos desmarcados");
            guardarHabitos();
            renderHabitos();
            cuentaHabitos();
        }

        //Eliminar Habito
        function eliminarHabito(index){
            const confirmar = confirm("Deseas borrar este hábito?");
            if(!confirmar)return;
            mostrarLogro("Hábito eliminado");

            habitos.splice(index, 1);
            guardarHabitos();
            renderHabitos();
        }

        //editar habito
        function editarHabito(index){
            const nuevo = prompt("Editar Habito:", habitos[index].texto);
            if(nuevo){
                habitos[index].texto = nuevo;
                guardarHabitos();
                renderHabitos();
            }
        }
        renderHabitos();

    </script>
    
</body>
</html>
